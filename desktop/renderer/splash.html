<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<style>
  /* Essa página roda numa janela própria, do tamanho exato do cartão — sem
     nenhum fundo grande por trás (era assim antes: uma janela enorme escura
     com o cartão flutuando no meio dela). Agora "a janela É o cartão". */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .splash-card {
    position: relative;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    border-radius: 20px;
    background: linear-gradient(160deg, #2b2d31, #17181a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  .splash-logo {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    animation: logo-bounce 1.6s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }
  .splash-text {
    color: #e7e9ea;
    font: 600 13px system-ui, sans-serif;
    letter-spacing: 0.3px;
    animation: text-pulse 1.6s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }
  @keyframes logo-bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.05); }
  }
  @keyframes text-pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .splash-sparkles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .splash-sparkles span {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #c3c6cc;
    opacity: 0;
    animation: sparkle 2.2s ease-in-out infinite;
  }
  .splash-sparkles span:nth-child(1) { top: 28%; left: 26%; animation-delay: 0s; }
  .splash-sparkles span:nth-child(2) { top: 22%; left: 68%; animation-delay: 0.4s; }
  .splash-sparkles span:nth-child(3) { top: 40%; left: 78%; animation-delay: 0.9s; }
  .splash-sparkles span:nth-child(4) { top: 46%; left: 18%; animation-delay: 1.3s; }
  .splash-sparkles span:nth-child(5) { top: 18%; left: 46%; animation-delay: 1.7s; }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }
</style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-sparkles"><span></span><span></span><span></span><span></span><span></span></div>
    <img src="assets/logo.png" alt="" class="splash-logo" />
    <div class="splash-text">Iniciando...</div>
  </div>
</body>
</html>
