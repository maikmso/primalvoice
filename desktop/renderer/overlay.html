<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<style>
  /* Essa página roda numa janela SEPARADA da janela principal do
     PrimalVoice: transparente, sem borda, sempre no topo, do tamanho da
     tela inteira -- é o "overlay" que aparece por cima de QUALQUER outro
     programa/jogo enquanto você está compartilhando sua tela, igual o
     Discord faz. Por padrão o clique atravessa direto pro que estiver por
     baixo (ver overlayApi.setIgnoreMouseEvents no overlay.js); só fica
     "sólida" bem em cima de cada botão, enquanto o mouse estiver ali. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none;
  }
  .live-badge-group {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font: 700 12px inherit;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .live-badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ed4245;
  }
  .live-stop-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: none;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .live-stop-btn:hover { background: rgba(0, 0, 0, 0.92); }
  .live-stop-btn svg { width: 16px; height: 16px; }

  .overlay-controls-bar {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .overlay-ctrl-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .overlay-ctrl-btn:hover { background: rgba(0, 0, 0, 0.92); }
  .overlay-ctrl-btn svg { width: 22px; height: 22px; }
  .overlay-ctrl-btn.off { color: #ed4245; }
  .overlay-ctrl-btn.hangup-btn { background: #ed4245; }
  .overlay-ctrl-btn.hangup-btn svg { transform: rotate(135deg); }
  .overlay-ctrl-btn.hangup-btn:hover { background: #c73437; }
  .overlay-stop-share-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .overlay-stop-share-btn:hover { background: #e6e6e6; }
  .overlay-stop-share-btn svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="live-badge-group">
    <div class="live-badge"><span class="live-badge-dot"></span>AO VIVO</div>
    <button type="button" id="overlay-stop-live-btn" class="live-stop-btn hoverable" title="Parar de compartilhar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>

  <div class="overlay-controls-bar">
    <button type="button" id="overlay-cam-btn" class="overlay-ctrl-btn hoverable" title="Câmera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
    </button>
    <button type="button" id="overlay-stop-share-btn" class="overlay-stop-share-btn hoverable" title="Parar de compartilhar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line><line x1="7" y1="7" x2="17" y2="13"></line><line x1="17" y1="7" x2="7" y2="13"></line></svg>
    </button>
    <button type="button" id="overlay-mic-btn" class="overlay-ctrl-btn hoverable" title="Microfone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>
    <button type="button" id="overlay-hangup-btn" class="overlay-ctrl-btn hangup-btn hoverable" title="Desconectar da chamada">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
    </button>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
