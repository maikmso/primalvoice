services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: vortex-livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./livekit-config/livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2
    container_name: vortex-caddy
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    build: ./app
    container_name: vortex-app
    restart: unless-stopped
    network_mode: "host"
    env_file: .env

volumes:
  caddy_data:
  caddy_config:
